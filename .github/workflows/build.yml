name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # biri hata verse bile diğeri derlenmeye devam etsin
      matrix:
        include:
          - dir: .
            gradle: '8.10.2'
            name: thallium-mod-1.21
          - dir: mc1215
            gradle: '8.12.1'
            name: thallium-mod-1.21.5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-disabled: true # bozuk önbellek bağımlılık indirmeyi engelleyebiliyor
      - run: gradle build --no-daemon --refresh-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/thallium-*-mc*.jar
      - name: Release'e ekle (sadece v ile başlayan etiketlerde)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.dir }}/build/libs/thallium-*-mc*.jar
